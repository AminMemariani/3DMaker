[package]
name = "fake-provider"
description = "Local stand-in for the Anthropic, OpenAI and Ollama APIs and the Claude Code and Codex CLIs, answering with canned shape designs. Test-only; never bundled."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
# The Claude Code and Codex adapter tests need this crate's binary as a fake CLI.
maker-core = { path = "../maker-core" }
tempfile = { workspace = true }
tokio-util = { workspace = true }
