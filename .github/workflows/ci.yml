name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NODE_ENV: development

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev xvfb
      - run: npm ci --include=dev
      - name: Fixtures
        run: npm run fixtures
      - name: Rust format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (unit, PLY files, provider contracts)
        run: cargo test --workspace
      - name: TypeScript
        run: npm run typecheck
      - name: UI tests
        run: npm test
      - name: Renderer correctness + independent viewer (Playwright)
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run test:render; else npm run test:render; fi
      - name: Native end-to-end smoke (real app + fake provider)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a node tests/e2e-native/run.mjs; else node tests/e2e-native/run.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-${{ matrix.os }}
          path: |
            tests/output/
            test-results/
          if-no-files-found: ignore

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: npm ci --include=dev
      # Release builds never enable the `e2e` feature, so test drivers are not compiled in.
      - name: Build installers
        run: npx tauri build --bundles ${{ matrix.bundles }}
        env:
          # Optional signing inputs (release-time secrets). Unset → unsigned artifacts.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
