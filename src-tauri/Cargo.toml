[package]
name = "threedmaker"
description = "Describe one object, generate a 3D Gaussian splat with your own AI provider, inspect and export it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "threedmaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
maker-core = { path = "../crates/maker-core" }
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = { workspace = true }
url = { workspace = true }

[features]
# Test-only driver hooks (data-dir override, scripted export path, local
# provider base URLs). Never enabled for release bundles.
e2e = []
